# HAOS-Add-on: lokalen Mosquitto nur lesend in den IoT-Connector spiegeln (iot-connector#129, ADR 0001)
name: IoT Connector Bridge
version: "1.0.0"
slug: iot_connector_bridge
description: >-
  Spiegelt Topics des lokalen Mosquitto nur lesend in den IoT-Connector
  (Gimtiese-Tech). Home Assistant läuft unverändert weiter.
arch: [aarch64, amd64]
uart: false

# Zugangsdaten zum lokalen Mosquitto kommen über die Supervisor-API – nichts eintippen
services: ["mqtt:need"]

# Ingress-UI: Claim-Code eingeben, Status, letzte Übertragung, Puffergröße
ingress: true
ingress_port: 8099
panel_ingress: IoT Connector

# Nur lesend: kein Zugriff auf den Broker außer über mqtt:need, keine Hardware
hassio_api: false
homeassistant_api: false
host_network: false
usb: false
privileged: false
full_access: false
apparmor: disable
startup: services
boot: auto
init: false

# Add-on-Datenverzeichnis: Zugangsdaten, SQLite-Puffer, Status
map:
  - share:ro
  - config:ro
options:
  # MQTT-Filter (Wildcards wie in MQTT) – nur diese Topics werden abonniert
  topic_filters:
    - "zigbee2mqtt/#"
    - "shellies/#"
  # homeassistant/# ist standardmäßig aus – Discovery-Metadata folgen separat (#36)
  # Store-and-Forward: Puffergröße in Nachrichten. Mehr: älteste werden verworfen
  buffer_max_messages: 50000
  # Cloud (Übersteuerung nur für Tests – Default kommt aus dem Claim)
  backend_url: https://iot-connector.gimtiese-tech.de
  cloud_broker_url: wss://iot-connector-mqtt.gimtiese-tech.de
schema:
  topic_filters:
    - str
  buffer_max_messages: int(100,10000000)
  backend_url: str?
  cloud_broker_url: str?