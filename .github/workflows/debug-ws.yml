name: debug-ws
on: push
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p /tmp/mosq
          printf 'listener 1883\nallow_anonymous true\nlistener 9001\nprotocol websockets\nallow_anonymous true\n' > /tmp/mosq/mosquitto.conf
      - run: docker run -d --name mosq -p 18884:9001 -v /tmp/mosq/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro eclipse-mosquitto:2.0.22
      - run: sleep 3 && docker logs mosq
      - run: |
          python3 - <<'EOF'
          import socket
          s = socket.create_connection(("127.0.0.1", 18884), timeout=5)
          req = (b"GET /mqtt HTTP/1.1\r\nHost: 127.0.0.1:18884\r\nUpgrade: websocket\r\n"
                 b"Connection: Upgrade\r\nSec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\n"
                 b"Sec-WebSocket-Version: 13\r\nSec-WebSocket-Protocol: mqtt\r\n\r\n")
          s.sendall(req)
          print(s.recv(4096))
          EOF