name: debug-ws
on: push
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r iot-connector/app/requirements.txt
      - run: |
          mkdir -p /tmp/mosq
          printf 'listener 1883\nallow_anonymous true\nlistener 9001\nprotocol websockets\nallow_anonymous true\nlog_type all\n' > /tmp/mosq/mosquitto.conf
      - run: docker run -d --name mosq -p 18884:1883 -p 18885:9001 -v /tmp/mosq/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro eclipse-mosquitto:2.0.22
      - run: sleep 3
      - run: |
          cd iot-connector && python3 - <<'EOF'
          import sys, time
          sys.path.insert(0, ".")
          import paho.mqtt.client as mqtt
          from paho.mqtt.enums import CallbackAPIVersion
          from app.cloud import CloudClient
          from app.store import MessageStore

          received = []
          sub = mqtt.Client(CallbackAPIVersion.VERSION2, protocol=mqtt.MQTTv5, transport="websockets", client_id="ingest-test")
          sub.on_message = lambda c, u, m: received.append((m.topic, m.payload))
          sub.on_connect = lambda c, u, f, r, p=None: c.subscribe("d/gw-test/#", qos=1)
          sub.on_disconnect = lambda c, u, f, r, p=None: print("SUB-DISC", r, flush=True)
          sub.connect("127.0.0.1", 18885, 30)
          sub.loop_start()
          time.sleep(1)
          print("sub connected:", sub.is_connected(), flush=True)

          store = MessageStore("/tmp/b.sqlite", 10000)
          cloud = CloudClient("ws://127.0.0.1:18885/", "gw", "pw", "gw", "d/gw-test/", store)
          cloud.start()
          row = store.add("zigbee2mqtt/s0", b"hello", ts=123.0)
          time.sleep(1)
          print("cloud connected:", cloud.connected, "store:", store.count(), flush=True)
          cloud.replay()
          for i in range(30):
              time.sleep(0.2)
              if received and store.count() == 0:
                  break
          print("FINAL: received:", received, "store:", store.count(), "last_publish:", cloud.last_publish, flush=True)
          cloud.stop(); sub.loop_stop(); sub.disconnect(); store.close()
          EOF
      - run: docker logs mosq | tail -40