name: CI

on:
  push:
    branches: [main, beta]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check iot-connector/app tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r iot-connector/app/requirements.txt pytest
      - name: Unit-Tests (Allowlist, Puffer, Mapping)
        run: env -u DATABASE_URL pytest tests/test_mapping.py tests/test_store.py --no-cov
      - name: Integrationstest gegen lokale Mosquitto-Container
        run: env -u DATABASE_URL pytest tests/test_integration_mosquitto.py --no-cov
  build:
    # Image-Build für beide Architekturen – kein Push, nur prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: |
          docker build \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/aarch64-base-python:3.12 \
            iot-connector
      - run: |
          docker build \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-python:3.12 \
            iot-connector